# ====================================================================
# BOOTCAMP SOFTWARE ENGINEERING — LEVEL 2 (INTERMEDIATE: BACKEND)
# MODUL 11: CONTAINERIZATION (DOCKER & COMPOSE)
# Production Infrastructure as Code for TaskFlow Platform
# ====================================================================

name: taskflow-platform

services:
  # ------------------------------------------------------------------
  # 1. DATABASE SERVICE: POSTGRESQL 16 (3NF SCHEMA)
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-taskflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskflow_secret_2026}
      POSTGRES_DB: ${DB_NAME:-taskflow_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskflow_user} -d ${DB_NAME:-taskflow_production}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ------------------------------------------------------------------
  # 2. CACHE & IN-MEMORY STORE: REDIS 7
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ------------------------------------------------------------------
  # 3. BACKEND API SERVICE: TASKFLOW REST API (NESTJS)
  # ------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-taskflow_user}:${DB_PASSWORD:-taskflow_secret_2026}@postgres:5432/${DB_NAME:-taskflow_production}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_enterprise_jwt_key_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskflow-network

volumes:
  postgres_data:
    name: taskflow_postgres_data
  redis_data:
    name: taskflow_redis_data

networks:
  taskflow-network:
    driver: bridge
